<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loading…</title>
<style>html,body{margin:0;background:#050608;color:#f2f3f4}body{min-height:100vh}</style>
</head>
<body>
<script>
(async()=>{
  const res=await fetch('index-source.html?v=9',{cache:'no-store'});
  const html=await res.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelector('[data-route-page="home"] .home-bottom .enter')?.remove();
  const copy=doc.querySelector('[data-route-page="home"] .home-bottom p');
  if(copy){
    copy.innerHTML='<span>글로벌 음악 시장의 규모, K-pop의 해외 소비, 팬덤의 구매 행동, DSP의 발견 구조를 같은 리서치 흐름 안에서 검토했습니다.</span><span>각 수치에는 <b>출처·기간·정의</b>를 붙였고, 공개자료로 확인할 수 없는 항목은 내부 데이터 요청으로 남겼습니다.</span>';
  }
  doc.querySelector('link[href="v7.css"]')?.setAttribute('href','v7.css?v=9');
  doc.querySelector('script[src="v7.js"]')?.setAttribute('src','v7.js?v=9');
  document.open();
  document.write('<!doctype html>'+doc.documentElement.outerHTML);
  document.close();
})().catch(()=>{document.body.innerHTML='';});
</script>
</body>
</html>

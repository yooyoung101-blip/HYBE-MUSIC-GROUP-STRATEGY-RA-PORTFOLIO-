<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<title>APAC MUSIC INTELLIGENCE</title>
<style>html,body{margin:0;min-height:100%;background:#050608}</style>
</head>
<body>
<script>
(async()=>{
  const html=await fetch('index-source.html?v=10',{cache:'no-store'}).then(r=>r.text());
  const doc=new DOMParser().parseFromString(html,'text/html');

  doc.querySelector('[data-route-page="home"] .home-bottom .enter')?.remove();

  const copy=doc.querySelector('[data-route-page="home"] .home-bottom p');
  if(copy){
    copy.innerHTML='<span>글로벌 음악 시장의 규모, K-pop의 해외 소비, 팬덤의 구매 행동, DSP의 발견 구조를 같은 리서치 흐름 안에서 검토했습니다.</span><span>각 수치에는 <b>출처·기간·정의</b>를 붙였고, 공개자료로 확인할 수 없는 항목은 내부 데이터 요청으로 남겼습니다.</span>';
  }

  doc.querySelector('link[href="styles.css"]')?.setAttribute('href','styles.css?v=10');
  doc.querySelector('link[href="v7.css"]')?.setAttribute('href','v7.css?v=10');
  doc.querySelector('script[src="v7.js"]')?.setAttribute('src','v7.js?v=10');

  const openingStyle=doc.createElement('style');
  openingStyle.textContent=`
    [data-route-page="home"] .home-bottom .enter{display:none!important}
    [data-route-page="home"] .home-bottom{grid-template-columns:1fr!important}
    [data-route-page="home"] .home-bottom p>span{display:block}
    [data-route-page="home"] .home-bottom p>span+span{margin-top:.55em}
    [data-route-page="home"] .hero-title,
    [data-route-page="home"] .hero-line,
    [data-route-page="home"] .home-topline,
    [data-route-page="home"] .home-bottom{
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif!important
    }
    [data-route-page="home"] .hero-title .hero-line{
      background:none!important;
      -webkit-background-clip:initial!important;
      background-clip:initial!important;
      -webkit-text-fill-color:currentColor!important;
      text-shadow:none!important
    }
    [data-route-page="home"] .hero-title .hero-line:first-child{color:#f1f2f3!important}
    [data-route-page="home"] .hero-title .hero-line.metal{color:#aeb3b9!important}
  `;
  doc.head.appendChild(openingStyle);

  document.open();
  document.write('<!doctype html>'+doc.documentElement.outerHTML);
  document.close();
})().catch(()=>{document.body.innerHTML='';});
</script>
</body>
</html>

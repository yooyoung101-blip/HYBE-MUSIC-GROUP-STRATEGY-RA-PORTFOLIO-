<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<title>APAC MUSIC INTELLIGENCE</title>
<style>html,body{margin:0;min-height:100%;background:#050608}</style>
</head>
<body>
<script>
(async()=>{
  const html=await fetch('index-source.html?v=18e',{cache:'no-store'}).then(r=>r.text());
  const doc=new DOMParser().parseFromString(html,'text/html');

  const opening=doc.querySelector('[data-route-page="home"]');
  opening?.querySelector('.home-bottom .enter')?.remove();

  const hero=opening?.querySelector('.hero-title');
  if(hero){
    hero.innerHTML='<span class="hero-line">APAC</span><span class="hero-line">MUSIC</span><span class="hero-line intelligence">INTELLIGENCE</span>';
  }

  const copy=opening?.querySelector('.home-bottom p');
  if(copy){
    copy.innerHTML='<span>글로벌 음악 시장의 규모, K-pop의 해외 소비, 팬덤의 구매 행동, DSP의 발견 구조를 같은 리서치 흐름 안에서 검토했습니다.</span><span>각 수치에는 <b>출처·기간·정의</b>를 붙였고, 공개자료로 확인할 수 없는 항목은 내부 데이터 요청으로 남겼습니다.</span>';
  }

  doc.querySelector('link[href^="styles.css"]')?.setAttribute('href','styles.css?v=18e');
  doc.querySelector('link[href^="v7.css"]')?.setAttribute('href','v7.css?v=18e');
  doc.querySelector('script[src^="v7.js"]')?.setAttribute('src','v7.js?v=18e');

  const tuideCss=doc.createElement('link');
  tuideCss.rel='stylesheet';
  tuideCss.href='tuide.css?v=18e';
  doc.head.appendChild(tuideCss);

  const secondPassCss=doc.createElement('link');
  secondPassCss.rel='stylesheet';
  secondPassCss.href='strategy-second-pass.css?v=18e';
  doc.head.appendChild(secondPassCss);

  const finalPassCss=doc.createElement('link');
  finalPassCss.rel='stylesheet';
  finalPassCss.href='strategy-final-pass.css?v=18e';
  doc.head.appendChild(finalPassCss);

  const finalMobileQaCss=doc.createElement('link');
  finalMobileQaCss.rel='stylesheet';
  finalMobileQaCss.href='strategy-final-mobile-qa.css?v=18e';
  doc.head.appendChild(finalMobileQaCss);

  const correctionCss=doc.createElement('link');
  correctionCss.rel='stylesheet';
  correctionCss.href='strategy-v18e-correction.css?v=18e';
  doc.head.appendChild(correctionCss);

  const v7Script=doc.querySelector('script[src^="v7.js"]');
  if(v7Script){
    const tuideScript=doc.createElement('script');
    tuideScript.src='tuide-pre.js?v=18e';
    v7Script.parentNode.insertBefore(tuideScript,v7Script);

    const copyFixScript=doc.createElement('script');
    copyFixScript.src='tuide-copyfix.js?v=18e';
    v7Script.parentNode.insertBefore(copyFixScript,v7Script);

    const polishScript=doc.createElement('script');
    polishScript.src='copy-polish.js?v=18e';
    v7Script.parentNode.insertBefore(polishScript,v7Script);

    const secondPassScript=doc.createElement('script');
    secondPassScript.src='strategy-second-pass.js?v=18e';
    v7Script.parentNode.insertBefore(secondPassScript,v7Script);

    const secondPassQaScript=doc.createElement('script');
    secondPassQaScript.src='strategy-second-pass-qa.js?v=18e';
    v7Script.parentNode.insertBefore(secondPassQaScript,v7Script);

    const finalPassScript=doc.createElement('script');
    finalPassScript.src='strategy-final-pass.js?v=18e';
    v7Script.parentNode.insertBefore(finalPassScript,v7Script);

    const finalPassQaScript=doc.createElement('script');
    finalPassQaScript.src='strategy-final-pass-qa.js?v=18e';
    v7Script.parentNode.insertBefore(finalPassQaScript,v7Script);

    const correctionScript=doc.createElement('script');
    correctionScript.src='strategy-v18e-correction.js?v=18e';
    v7Script.parentNode.insertBefore(correctionScript,v7Script);

    const imageGuardScript=doc.createElement('script');
    imageGuardScript.src='strategy-v18e-image-guard.js?v=18e';
    v7Script.parentNode.insertBefore(imageGuardScript,v7Script);
  }

  const openingStyle=doc.createElement('style');
  openingStyle.textContent=`
    [data-route-page="home"] .home-bottom .enter{display:none!important}
    [data-route-page="home"] .home-wrap{min-height:100svh!important;padding:118px clamp(28px,5vw,72px) 70px!important;display:flex!important;flex-direction:column!important;align-items:stretch!important}
    [data-route-page="home"] .home-topline{margin:0!important;flex:none!important}
    [data-route-page="home"] .hero-title{width:100%!important;margin:clamp(72px,9vh,118px) 0 0!important;padding:0!important;border:0!important;background:none!important;text-align:left!important;display:flex!important;flex-direction:column!important;gap:0!important;overflow:visible!important;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif!important}
    [data-route-page="home"] .hero-title .hero-line{display:block!important;width:max-content!important;max-width:none!important;white-space:nowrap!important;margin:0!important;color:#f1f2f3!important;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif!important;font-size:clamp(82px,11.4vw,178px)!important;font-weight:650!important;line-height:.76!important;letter-spacing:-.082em!important;background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;-webkit-text-fill-color:currentColor!important;text-shadow:none!important}
    [data-route-page="home"] .hero-title .hero-line.intelligence{color:#b8bdc3!important}
    [data-route-page="home"] .home-bottom{display:block!important;margin:clamp(48px,6vh,78px) 0 0!important;flex:none!important}
    [data-route-page="home"] .home-bottom p{max-width:860px!important;margin:0!important;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif!important;font-size:15px!important;line-height:1.68!important;letter-spacing:-.025em!important;color:#9299a1!important}
    [data-route-page="home"] .home-bottom p>span{display:block!important}
    [data-route-page="home"] .home-bottom p>span+span{margin-top:.18em!important}
    @media(max-width:720px){[data-route-page="home"] .home-wrap{padding:112px 20px 74px!important}[data-route-page="home"] .home-topline{font-size:10px!important;letter-spacing:.13em!important}[data-route-page="home"] .hero-title{margin-top:66px!important;transform:none!important}[data-route-page="home"] .hero-title .hero-line{font-size:clamp(74px,18.1vw,82px)!important;line-height:.72!important;letter-spacing:-.09em!important}[data-route-page="home"] .home-bottom{margin-top:54px!important}[data-route-page="home"] .home-bottom p{max-width:none!important;font-size:15px!important;line-height:1.64!important;letter-spacing:-.022em!important}[data-route-page="home"] .home-bottom p>span+span{margin-top:.16em!important}}
  `;
  doc.head.appendChild(openingStyle);

  const qaStyle=doc.createElement('style');
  qaStyle.textContent=`
    .fp-home-depth .hero-line:nth-child(1),.fp-home-depth .hero-line:nth-child(2),.fp-home-depth .hero-line:nth-child(3){transform:none!important;animation:fpHeroReveal .8s var(--fp-ease) both!important}
    .fp-home-depth .hero-line:nth-child(1){translate:calc(var(--fp-x,0)*-2px) calc(var(--fp-y,0)*-2px) -30px}
    .fp-home-depth .hero-line:nth-child(2){translate:calc(var(--fp-x,0)*4px) calc(var(--fp-y,0)*3px) 18px;animation-delay:.08s!important}
    .fp-home-depth .hero-line:nth-child(3){translate:calc(var(--fp-x,0)*8px) calc(var(--fp-y,0)*6px) 52px;animation-delay:.16s!important}
    @keyframes fpHeroReveal{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
    .fp-home-foreground{transform:none!important;translate:calc(var(--fp-x,0)*3px) calc(var(--fp-y,0)*2px) 38px}
    .fp-tws-spatial .tws-photo{translate:0 calc(var(--fp-scroll,0)*8px) -55px}
    .fp-tws-spatial .tws-hero{transform:none!important;translate:0 calc(var(--fp-scroll,0)*-4px) 24px}
    .fp-tws-kpi-plane{transform:none!important;translate:0 calc(var(--fp-scroll,0)*-11px) 48px}
    @media(max-width:760px){.fp-home-depth .hero-line,.fp-home-foreground,.fp-tws-spatial .tws-photo,.fp-tws-spatial .tws-hero,.fp-tws-kpi-plane{translate:none!important}.fp-home-depth .hero-line{animation:fpHeroReveal .65s var(--fp-ease) both!important}}
    @media(prefers-reduced-motion:reduce){.fp-home-depth .hero-line{animation:none!important;opacity:1!important;filter:none!important;translate:none!important}.fp-home-foreground,.fp-tws-spatial .tws-photo,.fp-tws-spatial .tws-hero,.fp-tws-kpi-plane{translate:none!important}}
  `;
  doc.head.appendChild(qaStyle);

  document.open();
  document.write('<!doctype html>'+doc.documentElement.outerHTML);
  document.close();
})().catch(()=>{document.body.innerHTML='';});
</script>
</body>
</html>
